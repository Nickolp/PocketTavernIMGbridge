name: Build PocketTavern Vision APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vision-apk.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Patch build.gradle.kts and Kotlin sources for Vision
        run: |
          python3 - << 'EOF'
          import pathlib, re

          # 1. Отключаем экспериментальный CMake/MNN в app/build.gradle.kts (как в официальном релизе автора)
          gradle_path = pathlib.Path("app/build.gradle.kts")
          gradle_text = gradle_path.read_text()
          gradle_text = gradle_text.replace(
              'buildConfigField("boolean", "MNN_SDXL_ENABLED", "true")',
              'buildConfigField("boolean", "MNN_SDXL_ENABLED", "false")'
          )
          gradle_text = re.sub(
              r'externalNativeBuild\s*\{\s*cmake\s*\{[^}]*\}\s*\}',
              '',
              gradle_text
          )
          assert "externalNativeBuild" not in gradle_text, "Failed to strip externalNativeBuild"
          gradle_path.write_text(gradle_text)

          # 2. Патчим OpenAiCompatibleApi.kt: добавляем OaiRequestMessage с JsonElement для отправки
          api_path = pathlib.Path("app/src/main/kotlin/com/pockettavern/app/data/remote/api/OpenAiCompatibleApi.kt")
          api_text = api_path.read_text()

          api_text = api_text.replace(
              "val messages: List<OaiMessage>,",
              "val messages: List<OaiRequestMessage>,"
          )

          req_msg_class = """
          @Serializable
          data class OaiRequestMessage(
              val role: String,
              val content: kotlinx.serialization.json.JsonElement
          )
          """

          api_text = api_text.replace(
              "@Serializable\ndata class OaiMessage(",
              req_msg_class + "\n@Serializable\ndata class OaiMessage("
          )
          assert "OaiRequestMessage" in api_text, "Failed to patch OpenAiCompatibleApi.kt"
          api_path.write_text(api_text)

          # 3. Патчим LlmRepository.kt: добавляем top-level функцию toMultimodalJsonElement в конец файла
          repo_path = pathlib.Path("app/src/main/kotlin/com/pockettavern/app/data/repository/LlmRepository.kt")
          repo_text = repo_path.read_text()

          multimodal_helper = '''
          private fun toMultimodalJsonElement(raw: String): kotlinx.serialization.json.JsonElement {
              val marker = "![image](data:image/"
              val startIdx = raw.indexOf(marker)
              if (startIdx == -1) return kotlinx.serialization.json.JsonPrimitive(raw)
              val urlStart = startIdx + 9
              val endIdx = raw.indexOf(")", urlStart)
              if (endIdx == -1) return kotlinx.serialization.json.JsonPrimitive(raw)
              val dataUri = raw.substring(urlStart, endIdx)
              val fullTag = raw.substring(startIdx, endIdx + 1)
              val cleanText = raw.replace(fullTag, "").trim().ifEmpty { "Look at this image." }
              return kotlinx.serialization.json.buildJsonArray {
                  add(kotlinx.serialization.json.buildJsonObject {
                      put("type", kotlinx.serialization.json.JsonPrimitive("text"))
                      put("text", kotlinx.serialization.json.JsonPrimitive(cleanText))
                  })
                  add(kotlinx.serialization.json.buildJsonObject {
                      put("type", kotlinx.serialization.json.JsonPrimitive("image_url"))
                      put("image_url", kotlinx.serialization.json.buildJsonObject {
                          put("url", kotlinx.serialization.json.JsonPrimitive(dataUri))
                      })
                  })
              }
          }
          '''

          old_oai_block = 'val oaiMessages = messages?.map { OaiMessage(it.role, it.content) }\n            ?: listOf(OaiMessage("user", prompt))'
          new_oai_block = 'val oaiMessages = messages?.map { OaiRequestMessage(it.role, toMultimodalJsonElement(it.content)) }\n            ?: listOf(OaiRequestMessage("user", toMultimodalJsonElement(prompt)))'
          assert old_oai_block in repo_text, "Failed to find oaiMessages block in LlmRepository.kt"

          repo_text = repo_text.replace(old_oai_block, new_oai_block)
          repo_text = repo_text.replace("m.content.lines()", "m.content.toString().lines()")
          repo_text = repo_text + "\n" + multimodal_helper + "\n"
          repo_path.write_text(repo_text)

          # 4. Патчим MessageInput.kt: добавляем кнопку выбора картинки (иконка Image) с сохранением пропорций
          input_path = pathlib.Path("app/src/main/kotlin/com/pockettavern/app/ui/components/MessageInput.kt")
          input_text = input_path.read_text()

          extra_imports = """import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import android.util.Base64
          import java.io.ByteArrayOutputStream
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.material.icons.filled.Image
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalContext
          """

          input_text = input_text.replace(
              "import androidx.compose.runtime.Composable",
              extra_imports
          )

          picker_block = """
              val context = LocalContext.current
              var attachedImageUri by remember { mutableStateOf<String?>(null) }
              val imagePicker = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  uri?.let {
                      try {
                          context.contentResolver.openInputStream(it)?.use { stream ->
                              val original = BitmapFactory.decodeStream(stream)
                              if (original != null) {
                                  val maxDim = 1024
                                  val ratio = minOf(maxDim.toFloat() / original.width, maxDim.toFloat() / original.height, 1f)
                                  val newW = (original.width * ratio).toInt().coerceAtLeast(1)
                                  val newH = (original.height * ratio).toInt().coerceAtLeast(1)
                                  val scaled = if (ratio < 1f) Bitmap.createScaledBitmap(original, newW, newH, true) else original
                                  val out = ByteArrayOutputStream()
                                  scaled.compress(Bitmap.CompressFormat.JPEG, 85, out)
                                  val b64 = Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
                                  attachedImageUri = "data:image/jpeg;base64,$b64"
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }
          """

          input_text = input_text.replace(
              "    Surface(",
              picker_block + "\n    Surface(",
              1
          )

          image_button_ui = """
                      IconButton(
                          onClick = {
                              if (attachedImageUri != null) {
                                  attachedImageUri = null
                              } else {
                                  imagePicker.launch("image/*")
                              }
                          },
                          enabled = enabled
                      ) {
                          Icon(
                              imageVector = Icons.Default.Image,
                              contentDescription = "Attach image",
                              tint = if (attachedImageUri != null) MaterialTheme.colorScheme.primary
                                     else if (enabled) MaterialTheme.colorScheme.onSurfaceVariant
                                     else MaterialTheme.colorScheme.onSurface.copy(alpha = 0.38f)
                          )
                      }
          """

          input_text = input_text.replace(
              "if (onVoiceInput != null) {",
              image_button_ui + "\n            if (onVoiceInput != null) {"
          )

          old_send_block = "onClick = onSend,\n                enabled = enabled && value.isNotBlank(),"
          new_send_block = """onClick = {
                          val img = attachedImageUri
                          if (img != null) {
                              val prefix = if (value.isBlank()) "" else "$value\\n\\n"
                              onValueChange(prefix + "![image]($img)")
                              attachedImageUri = null
                          }
                          onSend()
                      },
                      enabled = enabled && (value.isNotBlank() || attachedImageUri != null),"""
          assert old_send_block in input_text, "Failed to find onSend block in MessageInput.kt"
          input_text = input_text.replace(old_send_block, new_send_block)

          input_path.write_text(input_text)
          print("All 4 files patched and verified with assertions!")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@main
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@main
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@main
        with:
          name: PocketTavern-Vision-APK
          path: app/build/outputs/apk/debug/*.apk
